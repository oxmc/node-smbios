name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest currently aliases to an image shipping a Visual
        # Studio release node-gyp can't parse ("unknown version 'undefined'
        # found at .../Visual Studio/18/..."), crashing every Windows job.
        # Pinned to windows-2022, a distinct still-supported runner label,
        # to sidestep it (see oxmc/node-gpu for the same fix + root cause).
        os: [ubuntu-latest, windows-2022, macos-latest]
        node: [18, 20, 22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip

      - name: Setup Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python setuptools (macOS)
        if: runner.os == 'macOS'
        run: pip3 install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build addon
        run: npm run build
